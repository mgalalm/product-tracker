version: '3.8'
services:
  crawler:
    build:
      context: ./crawler
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./crawler:/app
    env_file:
      - crawler/.env
    environment:
      - FLASK_APP=app/app.py
      - FLASK_ENV=development
      - FLASK_DEBUG=1