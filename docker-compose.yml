version: '3.8'
services:
  crawler:
    build:
      context: ./crawler
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    volumes:
      - ./crawler:/app
    env_file:
      - crawler/.env
    environment:
      - FLASK_APP=app/app.py
      - FLASK_ENV=development
      - FLASK_DEBUG=1
  
  redis:
    image: redis:latest
    container_name: redis-container
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: always
volumes:
  redis-data:
    driver: local